name: Budget Transfer Digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 2"   # every Tuesday  8am UTC
    - cron: "0 8 * * 4"   # every Thursday 8am UTC

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth requests

      - name: Run Budget Transfer Digest
        env:
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python workflows/budget_transfer_digest.py
