name: Budget Transfer Digest

on:
  workflow_dispatch:
    inputs:
      send_to:
        description: "Slack user ID or channel ID to send to"
        required: false
        default: "U07628FGAN9"
      mode:
        description: "test or live (used for display label only)"
        required: false
        default: "test"
      workspace:
        description: "production or sandbox"
        required: false
        default: "production"
  schedule:
    - cron: "0 8 * * 2"   # every Tuesday  8am UTC
    - cron: "0 8 * * 4"   # every Thursday 8am UTC

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth slack-sdk

      - name: Run Budget Transfer Digest
        env:
          SLACK_BOT_TOKEN:    ${{ github.event.inputs.workspace == 'sandbox' && secrets.SLACK_BOT_TOKEN_SANDBOX || secrets.SLACK_BOT_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_APPDEV }}
          SLACK_CHANNEL_ID:   ${{ secrets.SLACK_CHANNEL_ID }}
          WORKFLOW_MODE:      ${{ github.event.inputs.mode || 'live' }}
          SEND_TO:            ${{ github.event.inputs.send_to || 'CHANNEL' }}
        run: python workflows/budget_transfer_digest.py
