name: UMP Lock Announcement

on:
  workflow_dispatch:
    inputs:
      send_to:
        description: "Slack user ID or channel ID to send to"
        required: false
        default: "U07628FGAN9"
      mode:
        description: "test or live (used for display label only)"
        required: false
        default: "test"
      quarter:
        description: "Quarter to lock (Q2, Q3, Q4)"
        required: false
        default: "Q3"

jobs:
  run-ump-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth slack-sdk

      - name: Run UMP Lock Announcement
        env:
          SLACK_BOT_TOKEN:    ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          WORKFLOW_MODE:      ${{ github.event.inputs.mode || 'test' }}
          SEND_TO:            ${{ github.event.inputs.send_to || 'U07628FGAN9' }}
          QUARTER:            ${{ github.event.inputs.quarter || 'Q3' }}
        run: python workflows/ump_lock.py
